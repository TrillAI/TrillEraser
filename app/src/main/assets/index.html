<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Trill Eraser</title>

<style>

  :root{

    --bg:#0B0E14; --bg2:#05070C; --panel:#151922;

    --tile:#252B37; --tile-active:#3A1B1E; --line:#232A36;

    --text:#F4F6FA; --muted:#98A1B3; --dim:#5C6575;

    --red:#FF544F; --teal:#35E2C7;

  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}

  html,body{margin:0;padding:0;background:#04060B;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);}

  button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;padding:0;}

  button:active{transform:scale(.97);}

  .hidden{display:none!important;}

  svg{display:block;}

  #app{width:min(430px,100vw);height:min(920px,100vh);margin:auto;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;border-radius:26px;border:1px solid #1A2029;box-shadow:0 30px 80px rgba(0,0,0,.6);}

  @media (max-width:480px){body{background:var(--bg)}#app{width:100%;height:100vh;border:none;border-radius:0;box-shadow:none;}}

  .view{display:none;flex-direction:column;flex:1;min-height:0;}

  .view.active{display:flex;}



  #view-home{padding:40px 26px calc(18px + env(safe-area-inset-bottom));align-items:center;overflow:auto;}

  .logo-tile{width:74px;height:74px;border-radius:22px;background:linear-gradient(160deg,#12202A,#0E1620);border:1px solid #223140;display:grid;place-items:center;color:var(--teal);}

  #view-home h1{font-size:31px;font-weight:800;margin:18px 0 6px;}

  #view-home .tag{color:var(--muted);font-size:15px;text-align:center;margin:0 0 26px;line-height:1.45;max-width:300px;}

  .upload-card{width:100%;border:1.6px dashed #3A4353;background:var(--panel);border-radius:22px;padding:30px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--red);}

  .upload-card .uc-title{color:var(--text);font-size:17px;font-weight:700;}

  .upload-card .uc-sub{color:var(--dim);font-size:12.5px;font-weight:600;}

  .ghost-btn{width:100%;margin-top:12px;border:1.5px solid var(--line);background:var(--panel);border-radius:18px;padding:15px;font-size:15.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;}

  .ghost-btn svg{color:var(--teal);}

  .home-foot{margin-top:auto;padding-top:26px;font-size:11.5px;color:var(--dim);font-weight:600;text-align:center;}



  .topbar{height:60px;display:flex;align-items:center;padding:0 14px;position:relative;flex:none;}

  .topbar .title{position:absolute;left:50%;transform:translateX(-50%);font-size:20px;font-weight:700;}

  .iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;}

  .nextbtn{margin-left:auto;border:2.4px solid var(--red);color:var(--red);border-radius:14px;padding:6px 19px;font-size:19px;font-weight:700;}

  .savebtn{margin-left:auto;background:var(--red);color:#fff;border-radius:14px;padding:9px 22px;font-size:17px;font-weight:800;}



  #stage{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--bg2);touch-action:none;}

  #canvasWrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);will-change:transform;}

  #stage canvas{position:absolute;inset:0;width:100%;height:100%;}

  #fillCanvas,#antsCanvas{pointer-events:none;}

  #brushRing{position:absolute;border:1.6px solid rgba(255,255,255,.95);border-radius:50%;pointer-events:none;z-index:6;transform:translate(-50%,-50%);display:none;box-shadow:0 0 0 1px rgba(0,0,0,.35);}

  #ripple{position:absolute;border:2.5px solid rgba(255,84,79,.95);border-radius:50%;pointer-events:none;z-index:4;transform:translate(-50%,-50%);}

  #ripple.go{animation:rip .6s ease-out forwards;}

  @keyframes rip{from{width:20px;height:20px;opacity:1}to{width:130px;height:130px;opacity:0}}



  #actionbar{position:absolute;left:14px;right:14px;bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:6;}

  .ab-group{display:flex;gap:10px;}

  .ab-btn{width:50px;height:50px;border-radius:15px;background:rgba(222,228,238,.16);backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center;}

  .ab-btn.disabled{opacity:.35;pointer-events:none;}

  #btnRemove{background:var(--red);color:#fff;border-radius:20px;padding:15px 34px;font-size:21px;font-weight:800;box-shadow:0 12px 34px rgba(255,84,79,.4);}



  #busy{position:absolute;inset:0;z-index:8;background:rgba(4,6,11,.62);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}

  .spinner{width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.14);border-top-color:var(--red);animation:spin .8s linear infinite;}

  @keyframes spin{to{transform:rotate(360deg)}}

  #busyText{font-size:15px;font-weight:700;}

  .pbar{width:190px;height:4px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;}

  #pbarFill{display:block;height:100%;width:0;background:var(--red);border-radius:99px;}



  #hint{text-align:center;padding:16px 12px 6px;font-size:16.5px;font-weight:650;flex:none;}

  #brushRow{flex:none;display:flex;align-items:center;gap:12px;padding:2px 24px 6px;font-size:13px;font-weight:700;color:var(--muted);}

  #brushRow input{flex:1;accent-color:var(--red);}

  #brushVal{width:34px;text-align:right;color:var(--text);}

  .toolbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:10px 18px calc(16px + env(safe-area-inset-bottom));}

  .tool{display:flex;flex-direction:column;align-items:center;color:var(--text);}

  .tool .tile{width:100%;aspect-ratio:1/1.02;background:var(--tile);border-radius:18px;display:grid;place-items:center;}

  .tool .lbl{margin-top:9px;font-size:15.5px;font-weight:700;}

  .tool.active{color:var(--red);}

  .tool.active .tile{background:var(--tile-active);}

  .tool.disabled{color:var(--dim);pointer-events:none;}



  #cmpArea{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px;}

  #cmpWrap{position:relative;border-radius:16px;overflow:hidden;touch-action:none;background:#000;}

  #cmpWrap canvas{position:absolute;inset:0;width:100%;height:100%;}

  #cmpLine{position:absolute;top:0;bottom:0;width:2.5px;background:#fff;z-index:3;}

  #cmpKnob{position:absolute;top:50%;width:40px;height:40px;border-radius:50%;background:#fff;color:#10141C;display:grid;place-items:center;transform:translate(-50%,-50%);z-index:4;}

  .cmp-chip{position:absolute;top:12px;padding:5px 12px;border-radius:999px;background:rgba(6,9,14,.55);font-size:12px;font-weight:800;z-index:3;}

  .cmp-chip.l{left:12px;} .cmp-chip.r{right:12px;}

  .result-note{text-align:center;color:var(--muted);font-size:13.5px;font-weight:600;padding:2px 0 10px;}

  .result-btns{flex:none;display:flex;gap:12px;padding:4px 18px calc(18px + env(safe-area-inset-bottom));}

  .result-btns .ghost-btn{margin-top:0;}

  .ghost-btn.danger{border-color:rgba(255,84,79,.45);color:var(--red);}

  .ghost-btn.danger svg{color:var(--red);}



  #toasts{position:absolute;left:0;right:0;bottom:128px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;}

  .toast{background:rgba(17,21,29,.94);border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:650;opacity:0;transform:translateY(8px);transition:.25s;max-width:86%;text-align:center;}

  .toast.in{opacity:1;transform:none;}

  #modalWrap{position:absolute;inset:0;z-index:70;background:rgba(2,4,8,.66);display:grid;place-items:center;padding:24px;}

  .modal-card{width:min(320px,100%);background:#1C212C;border:1px solid var(--line);border-radius:22px;padding:22px;}

  .modal-card h3{margin:0;font-size:18px;font-weight:800;}

  .modal-card p{margin:9px 0 20px;font-size:14.5px;color:var(--muted);line-height:1.5;}

  .modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .modal-btns button{border-radius:14px;padding:12px;font-weight:700;font-size:15px;}

  #mCancel{border:1.5px solid var(--line);}

  #mOk{background:var(--red);color:#fff;}

</style>

</head>

<body>

<div id="app">

  <section id="view-home" class="view active">

    <div class="logo-tile">

      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path fill="currentColor" fill-opacity=".18" d="M7 3h10l4.5 6L12 21.5 2.5 9 7 3Z"/><path d="M2.5 9h19M12 21.5 8.2 9 12 3l3.8 6-3.8 12.5"/></svg>

    </div>

    <h1>Trill Eraser</h1>

    <p class="tag">Tap or brush something you don't want. It's filled in with the background around it.</p>

    <button class="upload-card" id="btnPick">

      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4.5"/><path d="m7.5 9 4.5-4.5L16.5 9"/><path d="M4.5 16.5v2a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-2"/></svg>

      <span class="uc-title">Choose a photo</span>

      <span class="uc-sub">PNG · JPG — or drop / paste</span>

    </button>

    <button class="ghost-btn" id="btnSample">Try the sample scene</button>

    <div class="home-foot">Runs on this device · nothing is uploaded</div>

  </section>



  <section id="view-editor" class="view">

    <header class="topbar">

      <button class="iconbtn" id="btnBack" aria-label="Back">

        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5.5"/><path d="m11.5 6-6 6 6 6"/></svg>

      </button>

      <div class="title">Remove</div>

      <button class="nextbtn" id="btnNext">Next</button>

    </header>

    <div id="stage">

      <div id="canvasWrap">

        <canvas id="imgCanvas"></canvas>

        <canvas id="fillCanvas"></canvas>

        <canvas id="antsCanvas"></canvas>

        <div id="ripple" class="hidden"></div>

        <div id="actionbar" class="hidden ui">

          <div class="ab-group">

            <button class="ab-btn disabled" id="btnUndo" aria-label="Undo"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M8.5 5.5 4 10l4.5 4.5"/><path d="M4 10h9.5a6 6 0 0 1 6 6v1.5"/></svg></button>

            <button class="ab-btn disabled" id="btnRedo" aria-label="Redo"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="m15.5 5.5 4.5 4.5-4.5 4.5"/><path d="M20 10h-9.5a6 6 0 0 0-6 6v1.5"/></svg></button>

          </div>

          <button id="btnRemove">REMOVE</button>

          <button class="ab-btn" id="btnZoom" aria-label="Zoom"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 2.5V16A1.5 1.5 0 0 0 8 17.5h13.5"/><path d="M2.5 6.5H16A1.5 1.5 0 0 1 17.5 8v13.5"/></svg></button>

        </div>

        <div id="busy" class="hidden ui">

          <div class="spinner"></div>

          <div id="busyText">Redrawing background…</div>

          <div class="pbar"><i id="pbarFill"></i></div>

        </div>

      </div>

      <div id="brushRing"></div>

    </div>

    <div id="hint">Tap to select something</div>

    <div id="brushRow" class="hidden">

      <span>Size</span>

      <input type="range" id="brushSize" min="2" max="14" step="1" value="4">

      <span id="brushVal">4%</span>

    </div>

    <nav class="toolbar">

      <button class="tool" data-tool="brush"><span class="tile"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="m20.5 3.5a2.1 2.1 0 0 1 0 3l-8.4 8.4-3-3 8.4-8.4a2.1 2.1 0 0 1 3 0Z"/></svg></span><span class="lbl">Brush</span></button>

      <button class="tool" data-tool="lasso"><span class="tile"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><ellipse cx="11.5" cy="9.3" rx="7" ry="4.7" stroke-dasharray="3.1 2.7"/></svg></span><span class="lbl">Lasso</span></button>

      <button class="tool active" data-tool="detect"><span class="tile"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="6.2"/><circle cx="12" cy="12" r="1.35" fill="currentColor" stroke="none"/></svg></span><span class="lbl">Detect</span></button>

      <button class="tool disabled" data-tool="deselect" id="toolDeselect"><span class="tile"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="m8.8 9.8 5.9 5.9"/><path d="M4 21h16"/></svg></span><span class="lbl">Clear</span></button>

    </nav>

  </section>



  <section id="view-result" class="view">

    <header class="topbar">

      <button class="iconbtn" id="btnResBack"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5.5"/><path d="m11.5 6-6 6 6 6"/></svg></button>

      <div class="title">Result</div>

      <button class="savebtn" id="btnSave">Save</button>

    </header>

    <div id="cmpArea">

      <div id="cmpWrap">

        <canvas id="cmpOrig"></canvas>

        <canvas id="cmpEdit"></canvas>

        <div id="cmpLine"></div>

        <div id="cmpKnob"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m9 6-4 6 4 6M15 6l4 6-4 6"/></svg></div>

        <span class="cmp-chip l">BEFORE</span>

        <span class="cmp-chip r">AFTER</span>

      </div>

    </div>

    <p class="result-note">Drag to compare</p>

    <div class="result-btns">

      <button class="ghost-btn danger" id="btnMore">Remove more</button>

      <button class="ghost-btn" id="btnStartOver">Start over</button>

    </div>

  </section>



  <div id="toasts"></div>

  <div id="modalWrap" class="hidden">

    <div class="modal-card">

      <h3 id="mTitle"></h3>

      <p id="mBody"></p>

      <div class="modal-btns"><button id="mCancel">Cancel</button><button id="mOk">OK</button></div>

    </div>

  </div>

</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script>

(function(){

'use strict';

const $=s=>document.querySelector(s);

const clamp=(v,a,b)=>v<a?a:v>b?b:v;

const wait=ms=>new Promise(r=>setTimeout(r,ms));

const raf=()=>new Promise(r=>requestAnimationFrame(r));

const stage=$('#stage'), wrap=$('#canvasWrap');

const imgCanvas=$('#imgCanvas'), fillCanvas=$('#fillCanvas'), antsCanvas=$('#antsCanvas');

const ictx=imgCanvas.getContext('2d',{willReadFrequently:true});

const fctx=fillCanvas.getContext('2d');

const actx=antsCanvas.getContext('2d',{willReadFrequently:true});

const maskCv=document.createElement('canvas');

const mctx=maskCv.getContext('2d',{willReadFrequently:true});

const S={hasImage:false,busy:false,tool:'detect',W:0,H:0,displayScale:1,mask:null,hasSel:false,paths:[],history:[],histIdx:-1,zoom:1,tx:0,ty:0,zoomIdx:0,brushPct:4,lassoPts:null,antsRAF:null,lastContour:0};



function showView(v){document.querySelectorAll('.view').forEach(el=>el.classList.toggle('active',el.id==='view-'+v));}

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toasts').appendChild(t);requestAnimationFrame(()=>t.classList.add('in'));setTimeout(()=>{t.classList.remove('in');setTimeout(()=>t.remove(),300);},2300);}

let modalRes=null;

function confirmDlg(title,body,okText){$('#mTitle').textContent=title;$('#mBody').textContent=body;$('#mOk').textContent=okText||'OK';$('#modalWrap').classList.remove('hidden');return new Promise(res=>{modalRes=res;});}

$('#mCancel').onclick=()=>{$('#modalWrap').classList.add('hidden');modalRes&&modalRes(false);};

$('#mOk').onclick=()=>{$('#modalWrap').classList.add('hidden');modalRes&&modalRes(true);};



function setImage(src,w,h,tip){

  const MAX=1200,sc=Math.min(1,MAX/Math.max(w,h));

  S.W=Math.max(1,Math.round(w*sc));S.H=Math.max(1,Math.round(h*sc));

  [imgCanvas,fillCanvas,antsCanvas,maskCv].forEach(c=>{c.width=S.W;c.height=S.H;});

  ictx.clearRect(0,0,S.W,S.H);ictx.drawImage(src,0,0,S.W,S.H);

  mctx.clearRect(0,0,S.W,S.H);

  S.hasImage=true;S.hasSel=false;S.paths=[];S.mask=null;S.lassoPts=null;

  S.history=[];S.histIdx=-1;pushHistory();

  S.zoom=1;S.tx=0;S.ty=0;S.zoomIdx=0;

  applyTransform();setTool('detect');updateSelUI();updateUndoRedo();

  showView('editor');

  requestAnimationFrame(()=>{fitCanvas();applyTransform();});

  if(tip) setTimeout(()=>toast(tip),350);

}

async function loadFromFile(file){

  try{

    let src=window.createImageBitmap?await createImageBitmap(file,{imageOrientation:'from-image'}).catch(()=>createImageBitmap(file)):await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im);};im.onerror=rej;im.src=u;});

    setImage(src,src.width,src.height,'Tap something to select it, then Remove');

  }catch(e){toast("Couldn't load that image");}

}

function makeSample(){

  const c=document.createElement('canvas');c.width=900;c.height=1200;const g=c.getContext('2d');

  const sky=g.createLinearGradient(0,0,0,540);sky.addColorStop(0,'#4FA8E8');sky.addColorStop(1,'#BFE6FB');g.fillStyle=sky;g.fillRect(0,0,900,540);

  g.fillStyle='#FFD75E';g.beginPath();g.arc(710,170,80,0,7);g.fill();

  g.fillStyle='#fff';g.beginPath();g.ellipse(190,170,95,42,0,0,7);g.ellipse(250,185,70,32,0,0,7);g.fill();

  const sea=g.createLinearGradient(0,530,0,760);sea.addColorStop(0,'#2E86C9');sea.addColorStop(1,'#37A7DF');g.fillStyle=sea;g.fillRect(0,530,900,230);

  g.fillStyle='#fff';g.beginPath();g.moveTo(270,530);g.lineTo(270,655);g.lineTo(195,655);g.closePath();g.fill();

  g.fillStyle='#8A5A33';g.beginPath();g.moveTo(175,660);g.lineTo(390,660);g.lineTo(355,710);g.lineTo(215,710);g.closePath();g.fill();

  const sand=g.createLinearGradient(0,760,0,1200);sand.addColorStop(0,'#F2DCA8');sand.addColorStop(1,'#EAC97F');g.fillStyle=sand;g.fillRect(0,760,900,440);

  g.fillStyle='#FF5148';g.beginPath();g.arc(640,950,95,0,7);g.fill();

  g.fillStyle='#8B5CF6';g.beginPath();g.moveTo(380,1000);g.lineTo(490,1000);g.lineTo(470,1110);g.lineTo(400,1110);g.closePath();g.fill();

  g.fillStyle='#FF9F43';g.beginPath();g.arc(760,1120,55,0,7);g.fill();

  return c;

}

function fitCanvas(){if(!S.hasImage)return;const st=stage.getBoundingClientRect();const sc=Math.min((st.width-20)/S.W,(st.height-20)/S.H);S.displayScale=sc;wrap.style.width=(S.W*sc)+'px';wrap.style.height=(S.H*sc)+'px';}

function applyTransform(){wrap.style.transform=`translate(calc(-50% + ${S.tx}px), calc(-50% + ${S.ty}px)) scale(${S.zoom})`;}

function clampPan(){const st=stage.getBoundingClientRect();const cw=wrap.offsetWidth*S.zoom,ch=wrap.offsetHeight*S.zoom;const mx=Math.max(0,(cw-st.width)/2),my=Math.max(0,(ch-st.height)/2);S.tx=clamp(S.tx,-mx,mx);S.ty=clamp(S.ty,-my,my);}

window.addEventListener('resize',()=>{fitCanvas();clampPan();applyTransform();if($('#view-result').classList.contains('active'))fitCompare();});



function markSelDirty(){S.hasSel=true;scheduleSelUpdate();ensureAnts();}

let selPending=false;

function scheduleSelUpdate(){if(selPending)return;selPending=true;requestAnimationFrame(()=>{selPending=false;renderFillLayer();const now=performance.now();if(now-S.lastContour>110){S.lastContour=now;recomputeContours();}});}

function renderFillLayer(){fctx.clearRect(0,0,S.W,S.H);fctx.drawImage(maskCv,0,0);fctx.globalCompositeOperation='source-in';fctx.fillStyle='rgba(255,74,70,0.5)';fctx.fillRect(0,0,S.W,S.H);fctx.globalCompositeOperation='source-over';}

function ensureMaskArray(){S.mask=new Uint8Array(S.W*S.H);const d=mctx.getImageData(0,0,S.W,S.H).data;for(let i=0,j=3;i<S.mask.length;i++,j+=4)S.mask[i]=d[j]>127?1:0;}

function recomputeContours(){if(!S.hasSel){S.paths=[];return;}ensureMaskArray();S.paths=traceContours(S.mask,S.W,S.H);}

function setMaskFromBool(m){const id=mctx.createImageData(S.W,S.H),d=id.data;for(let i=0,j=0;i<m.length;i++,j+=4){if(m[i]){d[j]=d[j+1]=d[j+2]=d[j+3]=255;}}mctx.putImageData(id,0,0);S.hasSel=true;renderFillLayer();S.lastContour=0;recomputeContours();ensureAnts();updateSelUI();}

function clearSel(){S.hasSel=false;S.lassoPts=null;S.paths=[];mctx.clearRect(0,0,S.W,S.H);fctx.clearRect(0,0,S.W,S.H);actx.clearRect(0,0,S.W,S.H);if(S.mask)S.mask.fill(0);updateSelUI();}

}

function updateSelUI(){const showBar=S.hasSel||S.histIdx>0;$('#actionbar').classList.toggle('hidden',!showBar||!S.hasImage);$('#btnRemove').classList.toggle('hidden',!S.hasSel);$('#toolDeselect').classList.toggle('disabled',!S.hasSel);}

function setBusy(b,text){S.busy=b;$('#busy').classList.toggle('hidden',!b);if(text)$('#busyText').textContent=text;$('#pbarFill').style.width='0%';}

$('#btnRemove').onclick=async()=>{if(!S.hasSel||S.busy)return;setBusy(true,'Redrawing background…');await wait(40);try{await inpaint(f=>{$('#pbarFill').style.width=Math.round(f*100)+'%';});pushHistory();clearSel();toast('Gone — background filled in');}catch(e){toast('Try a smaller area');}setBusy(false);};



const ptrs=new Map();let stroke=null,pinch=null;

function toImg(e){const r=imgCanvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*S.W,y:(e.clientY-r.top)/r.height*S.H};}

stage.addEventListener('pointerdown',e=>{if(e.target.closest('.ui'))return;if(!S.hasImage||S.busy)return;stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){startPinch();S.lassoPts=null;stroke=null;return;}const p=toImg(e);if(S.tool==='brush'){stroke={type:'brush',lx:p.x,ly:p.y};stampBrushLine(p.x,p.y,p.x,p.y,brushR());}else if(S.tool==='lasso'){S.lassoPts=[{x:p.x,y:p.y}];stroke={type:'lasso'};ensureAnts();}else stroke={type:'tap',sx:e.clientX,sy:e.clientY,moved:false};});

stage.addEventListener('pointermove',e=>{updateBrushRing(e);if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&ptrs.size>=2){updatePinch();return;}if(!stroke)return;const p=toImg(e);if(stroke.type==='brush'){stampBrushLine(stroke.lx,stroke.ly,p.x,p.y,brushR());stroke.lx=p.x;stroke.ly=p.y;}else if(stroke.type==='lasso'){const last=S.lassoPts[S.lassoPts.length-1];if(Math.hypot(p.x-last.x,p.y-last.y)>1.5)S.lassoPts.push({x:p.x,y:p.y});}else if(stroke.type==='tap'){if(Math.hypot(e.clientX-stroke.sx,e.clientY-stroke.sy)>10){if(S.tool==='detect'&&S.zoom>1)stroke={type:'pan',px:e.clientX,py:e.clientY};else stroke.type='dead';}}else if(stroke.type==='pan'){S.tx+=e.clientX-stroke.px;S.ty+=e.clientY-stroke.py;stroke.px=e.clientX;stroke.py=e.clientY;clampPan();applyTransform();}});

function endPointer(e){ptrs.delete(e.pointerId);if(pinch&&ptrs.size<2){pinch=null;stroke=null;return;}if(!stroke)return;if(stroke.type==='tap'&&!stroke.moved){const p=toImg(e);if(S.tool==='detect')detectAt(p.x,p.y);else if(S.tool==='deselect'&&S.hasSel){clearSel();toast('Cleared');}}if(stroke.type==='lasso')lassoCommit();stroke=null;}

stage.addEventListener('pointerup',endPointer);stage.addEventListener('pointercancel',endPointer);

function updateBrushRing(e){const ring=$('#brushRing');if(S.tool!=='brush'||!S.hasImage||S.busy){ring.style.display='none';return;}const r=stage.getBoundingClientRect();ring.style.display='block';ring.style.left=(e.clientX-r.left)+'px';ring.style.top=(e.clientY-r.top)+'px';const d=2*brushR()*S.displayScale*S.zoom;ring.style.width=d+'px';ring.style.height=d+'px';}

function startPinch(){const [a,b]=[...ptrs.values()];pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:S.zoom,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,tx0:S.tx,ty0:S.ty};}

function updatePinch(){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y)||1;const z=clamp(pinch.z0*d/pinch.d0,1,5);const r=stage.getBoundingClientRect();const mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;const cx0=r.width/2,cy0=r.height/2;const l0x=(pinch.cx-r.left-cx0-pinch.tx0)/pinch.z0,l0y=(pinch.cy-r.top-cy0-pinch.ty0)/pinch.z0;S.tx=(mx-cx0)-z*l0x;S.ty=(my-cy0)-z*l0y;S.zoom=z;clampPan();applyTransform();}

stage.addEventListener('wheel',e=>{if(!S.hasImage)return;e.preventDefault();const r=stage.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;const z=clamp(S.zoom*Math.pow(1.0016,-e.deltaY),1,5);const cx0=r.width/2,cy0=r.height/2;const lx=(mx-cx0-S.tx)/S.zoom,ly=(my-cy0-S.ty)/S.zoom;S.tx=(mx-cx0)-z*lx;S.ty=(my-cy0)-z*ly;S.zoom=z;clampPan();applyTransform();},{passive:false});

$('#btnZoom').onclick=()=>{S.zoomIdx=(S.zoomIdx+1)%3;S.zoom=[1,2,3][S.zoomIdx];if(S.zoom===1){S.tx=0;S.ty=0;}clampPan();applyTransform();};

$('#brushSize').oninput=e=>{S.brushPct=+e.target.value;$('#brushVal').textContent=S.brushPct+'%';};

document.addEventListener('keydown',e=>{if(!$('#view-editor').classList.contains('active'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?$('#btnRedo').click():$('#btnUndo').click();}else if(e.key==='Escape'&&S.hasSel)clearSel();});

$('#btnBack').onclick=async()=>{if(S.histIdx>0){const ok=await confirmDlg('Discard changes?','Edits will be lost.','Discard');if(!ok)return;}resetAll();showView('home');};

$('#btnNext').onclick=()=>{if(!S.hasImage)return;openResult();};

function resetAll(){S.history=[];S.histIdx=-1;S.hasImage=false;S.hasSel=false;S.paths=[];S.mask=null;S.zoom=1;S.tx=0;S.ty=0;}

const cmpWrap=$('#cmpWrap'),cmpOrig=$('#cmpOrig'),cmpEdit=$('#cmpEdit');

function openResult(){cmpOrig.width=cmpEdit.width=S.W;cmpOrig.height=cmpEdit.height=S.H;cmpOrig.getContext('2d').drawImage(S.history[0],0,0);cmpEdit.getContext('2d').drawImage(imgCanvas,0,0);showView('result');requestAnimationFrame(()=>{fitCompare();setCompare(50);});}

function fitCompare(){const area=$('#cmpArea').getBoundingClientRect();const sc=Math.min((area.width-28)/S.W,(area.height-28)/S.H);cmpWrap.style.width=(S.W*sc)+'px';cmpWrap.style.height=(S.H*sc)+'px';}

function setCompare(p){p=clamp(p,1,99);$('#cmpLine').style.left=p+'%';$('#cmpKnob').style.left=p+'%';cmpEdit.style.clipPath=`inset(0 0 0 ${p}%)`;}

let cmpDrag=false;

cmpWrap.addEventListener('pointerdown',e=>{cmpDrag=true;cmpWrap.setPointerCapture(e.pointerId);moveCompare(e);});

cmpWrap.addEventListener('pointermove',e=>{if(cmpDrag)moveCompare(e);});

cmpWrap.addEventListener('pointerup',()=>cmpDrag=false);

function moveCompare(e){const r=cmpWrap.getBoundingClientRect();setCompare((e.clientX-r.left)/r.width*100);}

$('#btnResBack').onclick=()=>showView('editor');

$('#btnMore').onclick=()=>showView('editor');

$('#btnStartOver').onclick=async()=>{const ok=await confirmDlg('Start over?','Edits will be lost.','Start over');if(!ok)return;resetAll();showView('home');};

$('#btnSave').onclick=()=>{imgCanvas.toBlob(b=>{if(!b)return;const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='trill-eraser.png';a.click();toast('Saved');},'image/png');};

$('#btnPick').onclick=()=>$('#fileInput').click();

$('#btnSample').onclick=()=>{const c=makeSample();setImage(c,c.width,c.height,'Tap the ball or boat, then Remove');};

$('#fileInput').addEventListener('change',e=>{if(e.target.files&&e.target.files[0])loadFromFile(e.target.files[0]);e.target.value='';});

const home=$('#view-home');home.addEventListener('dragover',e=>e.preventDefault());home.addEventListener('drop',e=>{e.preventDefault();const f=[...(e.dataTransfer?.files||[])].find(f=>f.type.startsWith('image/'));if(f)loadFromFile(f);});

window.addEventListener('paste',e=>{const item=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(item){const f=item.getAsFile();if(f)loadFromFile(f);}});

})();

</script>

</body>
